<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0c29">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>دردشة</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0b0e17;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    #login-screen {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      background: linear-gradient(160deg, #0f0c29, #1a1a40);
    }

    #login-screen h1 {
      font-size: 32px;
      margin-bottom: 8px;
      background: linear-gradient(to right, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #login-screen p {
      color: #8892b0;
      margin-bottom: 40px;
      font-size: 15px;
    }

    .input-box {
      width: 100%;
      max-width: 340px;
      margin-bottom: 20px;
    }

    .input-box input {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    #login-btn {
      width: 100%;
      max-width: 340px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(to right, #00d2ff, #3a7bd5);
      color: white;
      font-size: 17px;
      font-weight: 600;
    }

    #chat-screen {
      display: none;
      height: 100vh;
      flex-direction: column;
      background: #0b0e17;
    }

    #header {
      height: 60px;
      background: #12162b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    #header h2 {
      font-size: 17px;
      font-weight: 600;
    }

    #header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      border: none;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #sidebar {
      position: absolute;
      top: 60px;
      right: 0;
      width: 280px;
      height: calc(100vh - 60px);
      background: #12162b;
      border-left: 1px solid rgba(255,255,255,0.06);
      transform: translateX(100%);
      transition: 0.25s ease;
      z-index: 20;
      display: flex;
      flex-direction: column;
    }

    #sidebar.open {
      transform: translateX(0);
    }

    .sidebar-title {
      padding: 16px;
      font-size: 14px;
      color: #00d2ff;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #online-count {
      background: #00d2ff;
      color: #000;
      font-size: 12px;
      font-weight: bold;
      padding: 2px 9px;
      border-radius: 20px;
    }

    #online-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      margin-bottom: 4px;
    }

    .user-item.me {
      background: rgba(0, 210, 255, 0.12);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(45deg, #00d2ff, #3a7bd5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      position: relative;
      flex-shrink: 0;
    }

    .status-dot {
      position: absolute;
      bottom: 1px;
      left: 1px;
      width: 11px;
      height: 11px;
      background: #22c55e;
      border-radius: 50%;
      border: 2px solid #12162b;
    }

    .user-name {
      font-size: 14px;
      font-weight: 500;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #0b0e17;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.45;
    }

    .msg.me {
      background: linear-gradient(to right, #00d2ff, #3a7bd5);
      align-self: flex-end;
      border-bottom-left-radius: 4px;
    }

    .msg.other {
      background: #1c223a;
      align-self: flex-start;
      border-bottom-right-radius: 4px;
    }

    .msg.system {
      align-self: center;
      background: rgba(255, 193, 7, 0.12);
      color: #ffc107;
      font-size: 13px;
      max-width: 90%;
      text-align: center;
      border-radius: 20px;
    }

    .msg-sender {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 3px;
      opacity: 0.85;
    }

    .msg-time {
      font-size: 11px;
      opacity: 0.55;
      margin-top: 5px;
      text-align: left;
    }

    .msg.me .msg-time {
      text-align: right;
    }

    #input-area {
      padding: 12px 14px;
      background: #12162b;
      display: flex;
      gap: 10px;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    #message-input {
      flex: 1;
      padding: 13px 18px;
      border: none;
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    #send-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(to right, #00d2ff, #3a7bd5);
      color: white;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 15;
      display: none;
    }

    #overlay.show {
      display: block;
    }
  </style>
</head>
<body>

  <div id="login-screen">
    <h1>دردشة</h1>
    <p>أدخل اسمك للانضمام</p>
    <div class="input-box">
      <input type="text" id="username" placeholder="اسمك هنا..." maxlength="20" autocomplete="off">
    </div>
    <button id="login-btn">دخول</button>
  </div>

  <div id="chat-screen">
    <div id="header">
      <h2>الغرفة العامة</h2>
      <div id="header-actions">
        <button class="icon-btn" id="members-btn">👥</button>
        <button class="icon-btn" id="logout-btn">⎋</button>
      </div>
    </div>

    <div id="overlay"></div>

    <div id="sidebar">
      <div class="sidebar-title">
        الأعضاء المتصلين
        <span id="online-count">0</span>
      </div>
      <div id="online-list"></div>
    </div>

    <div id="messages"></div>

    <div id="input-area">
      <input type="text" id="message-input" placeholder="اكتب رسالة..." autocomplete="off">
      <button id="send-btn">➤</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = null;

    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const membersBtn = document.getElementById('members-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const onlineList = document.getElementById('online-list');
    const onlineCount = document.getElementById('online-count');

    membersBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    });

    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });

    loginBtn.addEventListener('click', doLogin);
    usernameInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') doLogin();
    });

    function doLogin() {
      const name = usernameInput.value.trim();
      if (name.length < 2) {
        alert('الاسم لازم يكون حرفين على الأقل');
        return;
      }
      currentUser = name;
      socket.emit('join', name);
      loginScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      messageInput.focus();
    }

    socket.on('oldMessages', (msgs) => {
      msgs.forEach(msg => addMessage(msg, false));
      scrollBottom();
    });

    socket.on('message', (msg) => {
      addMessage(msg, true);
    });

    socket.on('onlineUsers', (users) => {
      onlineList.innerHTML = '';
      onlineCount.textContent = users.length;

      users.forEach(user => {
        const isMe = user.name === currentUser;
        const div = document.createElement('div');
        div.className = `user-item ${isMe ? 'me' : ''}`;
        div.innerHTML = `
          <div class="avatar">
            ${user.avatar}
            <div class="status-dot"></div>
          </div>
          <div class="user-name">\( {user.name} \){isMe ? ' (أنت)' : ''}</div>
        `;
        onlineList.appendChild(div);
      });
    });

    function addMessage(msg, animate = true) {
      const isMe = msg.sender === currentUser;
      const isSystem = msg.system;

      const div = document.createElement('div');
      div.className = `msg ${isSystem ? 'system' : (isMe ? 'me' : 'other')}`;

      if (isSystem) {
        div.innerHTML = `${escapeHtml(msg.text)}`;
      } else {
        div.innerHTML = `
          \( {!isMe ? `<div class="msg-sender"> \){escapeHtml(msg.sender)}</div>` : ''}
          <div>${escapeHtml(msg.text)}</div>
          <div class="msg-time">${msg.time}</div>
        `;
      }

      messagesDiv.appendChild(div);
      if (animate) scrollBottom();
    }

    function scrollBottom() {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !currentUser) return;
      socket.emit('chatMessage', { sender: currentUser, text });
      messageInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    logoutBtn.addEventListener('click', () => {
      if (confirm('تبي تخرج؟')) location.reload();
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
